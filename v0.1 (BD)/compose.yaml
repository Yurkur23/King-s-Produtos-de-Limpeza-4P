services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kings}
      POSTGRES_USER: ${POSTGRES_USER:-kings}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kings_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kings_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-kings}:${POSTGRES_PASSWORD:-kings_dev_password}@db:5432/${POSTGRES_DB:-kings}
      APP_ORIGIN: ${DOCKER_APP_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_DEMO: ${SEED_DEMO:-true}
      PAYMENT_MODE: ${PAYMENT_MODE:-mock}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:3001"
volumes:
  kings_postgres:
